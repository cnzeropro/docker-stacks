version: '3'
name: zookeeper-single
services:
  zoo:
    image: docker.io/zookeeper # docker.io/zookeeper:3.8
    container_name: zookeeper
    hostname: zk
    ports:
      - "2101:2181"
      - "2888:2888"
      - "3888:3888"
      - "8080:8080"
    volumes:
      - ./conf/:/conf/
      - ./data/:/data/
      - ./datalog/:/datalog/
      - ./logs/:/logs/