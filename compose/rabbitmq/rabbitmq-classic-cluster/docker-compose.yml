      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie ${RABBITMQ_COOKIE}"
      RABBITMQ_NODENAME: rabbit@node03
    volumes:
      - ./node03/data/:/var/lib/rabbitmq/
      # - ./node03/data/.erlang.cookie:/var/lib/rabbitmq/.erlang.cookie
      - ./node03/conf/:/etc/rabbitmq/
      - ./node03/logs/:/var/log/rabbitmq/
      - /etc/localtime:/etc/localtime:ro
