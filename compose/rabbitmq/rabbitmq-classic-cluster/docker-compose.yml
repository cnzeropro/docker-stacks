      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie ${RABBITMQ_COOKIE}"
      RABBITMQ_NODENAME: rabbit@node02
    volumes:
      - ./node02/data/:/var/lib/rabbitmq/
      # - ./node02/data/.erlang.cookie:/var/lib/rabbitmq/.erlang.cookie
      - ./node02/conf/:/etc/rabbitmq/
      - ./node02/logs/:/var/log/rabbitmq/
      - /etc/localtime:/etc/localtime:ro

  node03:
    image: docker.io/rabbitmq:${RABBITMQ_VERSION}
    hostname: node03
