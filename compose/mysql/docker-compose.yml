version: '3'
name: mysql

services:
  mysql:
    image: docker.io/mysql:${MYSQL_VERSION}
    # restart: always
    container_name: mysql
    environment:
      TZ: Asia/Shanghai
    env_file:
      - ./mysql.env
    ports:
      - ${MYSQL_PORT}:3306
      - ${MYSQL_ADMIN_PORT}:33062
    volumes:
      - ./conf/:/etc/mysql/conf.d/
      - ./data/:/var/lib/mysql/
      - ./init/:/docker-entrypoint-initdb.d/

  adminer:
    image: docker.io/adminer:${ADMINER_VERSION}
    container_name: adminer
    depends_on:
      - mysql
    ports:
      - ${ADMINER_PORT}:8080