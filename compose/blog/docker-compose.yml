version: '3.5'
name: blog

networks:
  blog-net:
    name: blog-net

services:
  wordpress:
    image: docker.io/wordpress:${WORDPRESS_VERSION}
    hostname: wordpress
    container_name: blog-wp
    depends_on:
      - mysql
    networks:
      - blog-net
    ports:
      - ${WORDPRESS_PORT}:80
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - ./wp:/var/www/html

  mysql:
    image: docker.io/mysql:${MYSQL_VERSION}
    hostname: mysql
    container_name: blog-db
    networks:
      - blog-net
    ports:
      - ${MYSQL_PORT}:3306
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./db:/var/lib/mysql

  phpmyadmin:
    image: docker.io/phpmyadmin:${PHPMYADMIN_VERSION}
    hostname: phpmyadmin
    container_name: blog-pma
    depends_on:
      - mysql
    networks:
      - blog-net
    ports:
      - ${PHPMYADMIN_PORT}:80
    environment:
      - PMA_HOST=mysql
      - PMA_ARBITRARY=1
